<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://telegram.org; style-src 'unsafe-inline'; connect-src 'none'; img-src data:">
  <meta name="referrer" content="no-referrer">
  <title>دخول Twist</title>
  <style>
    :root { color-scheme: light dark; font-family: Arial, sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px 18px;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #111111);
    }
    main { max-width: 420px; margin: 0 auto; }
    h1 { margin: 12px 0 8px; font-size: 24px; }
    p { color: var(--tg-theme-hint-color, #666666); line-height: 1.6; margin: 12px 0; }
    label { display: block; margin: 28px 0 8px; font-weight: 700; }
    input {
      width: 100%; min-height: 52px; padding: 12px 14px;
      border: 1px solid var(--tg-theme-hint-color, #999999);
      border-radius: 10px; background: var(--tg-theme-secondary-bg-color, #f3f3f3);
      color: var(--tg-theme-text-color, #111111); font-size: 18px;
    }
    button {
      width: 100%; min-height: 52px; margin-top: 18px; border: 0;
      border-radius: 10px; background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff); font-size: 17px;
      font-weight: 700;
    }
    textarea {
      width: 100%; min-height: 160px; padding: 12px 14px; margin-top: 8px;
      border: 1px solid var(--tg-theme-hint-color, #999999);
      border-radius: 10px; background: var(--tg-theme-secondary-bg-color, #f3f3f3);
      color: var(--tg-theme-text-color, #111111); font-family: monospace; font-size: 14px;
    }
    button:disabled { opacity: .55; }
    #status { min-height: 28px; margin-top: 14px; color: var(--tg-theme-hint-color, #666666); }
  </style>
</head>
<body>
<main>
  <h1 id="title">دخول حساب Twist</h1>
  <p id="intro">الباسورد يتشفر داخل موبايلك قبل الإرسال.</p>
  <form id="login-form">
    <label for="password">الباسورد</label>
    <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required autofocus>
    <button id="submit" type="submit">تسجيل الدخول</button>
  </form>
  <form id="add-email-form" hidden>
    <label for="add-email">الإيميل</label>
    <input id="add-email" name="email" type="email" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="320" required>
    <label for="add-email-password">الباسورد</label>
    <input id="add-email-password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
    <button id="add-email-submit" type="submit">إضافة وتسجيل الدخول</button>
  </form>
  <form id="import-form" hidden>
    <label for="import-file">ملف الحسابات (JSON)</label>
    <input id="import-file" name="import-file" type="file" accept=".json,application/json">
    <label for="import-text">أو الصق الـ JSON هنا</label>
    <textarea id="import-text" name="import-text" rows="8" spellcheck="false" autocomplete="off"></textarea>
    <button id="import-submit" type="submit">تشفير وتنزيل الملف</button>
  </form>
  <p id="status" role="status"></p>
</main>
<script>
(() => {
  'use strict';
  const PUBLIC_KEY = 'MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEApjCf+LaIOPER9/vdv6cFfKkyaPj4mOLgfCSqZCg0kw/eDzQptEPf4umUJacniggQR7EZ1a1twUpyqSX8bjsBySdHjco6CK67yK02KM2QD0Agx+geqU2tiPnuNWqvh1YnesN990GbtdTw4hXjWF8I3QDJ0qJP8YcvwpyC38JanCAHA7AI4tsjn/leE47Fl4c/gW7FcmRN7BQ4cGES2gbBTc1pPF+Us2n15ZztlS+5khV9KdDm1eIn2E+UqNEyMmqlaX/hmmFOk0qMRYZVFsl56+ajlVpdhwqvOZf5UoXcPW++29823bss96LkF2JDNZjRRwZq/Ocn+7UIhKaltKMjsQIDAQAB';
  const params = new URLSearchParams(location.search);
  const challenge = params.get('challenge') || '';
  const accountId = params.get('account') || '';
  const mode = params.get('mode') || '';
  const registerMode = mode === 'register';
  const createMode = mode === 'create';
  const importMode = mode === 'import';
  const addEmailMode = mode === 'add-email';
  const noAccountMode = registerMode || createMode || importMode || addEmailMode;
  let telegram = null;
  const form = document.getElementById('login-form');
  const password = document.getElementById('password');
  const submit = document.getElementById('submit');
  const addEmailForm = document.getElementById('add-email-form');
  const addEmailInput = document.getElementById('add-email');
  const addEmailPassword = document.getElementById('add-email-password');
  const addEmailSubmit = document.getElementById('add-email-submit');
  const importForm = document.getElementById('import-form');
  const importFile = document.getElementById('import-file');
  const importText = document.getElementById('import-text');
  const importSubmit = document.getElementById('import-submit');
  const status = document.getElementById('status');

  function bytesToBase64(bytes) {
    let binary = '';
    for (const value of bytes) binary += String.fromCharCode(value);
    return btoa(binary);
  }

  function base64ToBytes(value) {
    const binary = atob(value);
    return Uint8Array.from(binary, char => char.charCodeAt(0));
  }

  async function encryptPayload(payload) {
    const publicKey = await crypto.subtle.importKey(
      'spki', base64ToBytes(PUBLIC_KEY),
      { name: 'RSA-OAEP', hash: 'SHA-256' }, false, ['encrypt']
    );
    const aesKey = await crypto.subtle.generateKey(
      { name: 'AES-GCM', length: 256 }, true, ['encrypt']
    );
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const rawKey = new Uint8Array(await crypto.subtle.exportKey('raw', aesKey));
    const clear = new TextEncoder().encode(JSON.stringify(payload));
    const ciphertext = new Uint8Array(await crypto.subtle.encrypt(
      { name: 'AES-GCM', iv }, aesKey, clear
    ));
    const wrapped = new Uint8Array(await crypto.subtle.encrypt(
      { name: 'RSA-OAEP' }, publicKey, rawKey
    ));
    return {
      key: bytesToBase64(wrapped),
      iv: bytesToBase64(iv),
      ciphertext: bytesToBase64(ciphertext)
    };
  }

  function isUuidV4(value) {
    return /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(value);
  }

  function runWhenReady(fn) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', fn, { once: true });
    } else {
      fn();
    }
  }

  function init() {
    if (!telegram || !challenge || (!noAccountMode && !/^\d+$/.test(accountId))) {
      form.hidden = true;
      status.textContent = 'افتح الصفحة من زر دخول الإيميل داخل البوت.';
      return;
    }
    if (registerMode) {
      document.title = 'تجربة إنشاء إيميل (TEST)';
      document.getElementById('title').textContent = 'تجربة إنشاء إيميل (TEST)';
      document.getElementById('intro').textContent = 'ده اختبار. الباسورد يتشفر داخل موبايلك ويتبعت للتسجيل بس، ومش بيتحفظ.';
      submit.textContent = 'إنشاء الإيميل';
    }
    if (createMode) {
      document.title = 'إنشاء حساب إيميل';
      document.getElementById('title').textContent = 'إنشاء حساب إيميل';
      document.getElementById('intro').textContent = 'الباسورد يتشفر داخل موبايلك قبل الإرسال، ويتحفظ مشفر بعد التسجيل.';
      submit.textContent = 'إنشاء الحساب';
    }
    if (addEmailMode) {
      form.hidden = true;
      addEmailForm.hidden = false;
      document.title = 'إضافة حساب إيميل';
      document.getElementById('title').textContent = 'إضافة حساب إيميل';
      document.getElementById('intro').textContent = 'الإيميل والباسورد يتشفروا داخل موبايلك قبل الإرسال، والباسورد يتحفظ مشفر بعد الدخول.';
      addEmailForm.addEventListener('submit', async event => {
        event.preventDefault();
        const emailValue = addEmailInput.value.trim().toLowerCase();
        const passwordValue = addEmailPassword.value;
        if (!emailValue || !passwordValue) return;
        addEmailSubmit.disabled = true;
        status.textContent = 'جاري تشفير البيانات...';
        try {
          const envelope = await encryptPayload({ challenge, mode: 'add-email', email: emailValue, password: passwordValue });
          addEmailInput.value = '';
          addEmailPassword.value = '';
          telegram.sendData(JSON.stringify(envelope));
          status.textContent = 'تم الإرسال. ارجع للبوت.';
          setTimeout(() => telegram.close(), 400);
        } catch (_) {
          status.textContent = 'تعذر التشفير. اقفل الصفحة وجرب تاني.';
          addEmailSubmit.disabled = false;
        }
      });
    }
    if (importMode) {
      form.hidden = true;
      importForm.hidden = false;
      document.title = 'استيراد حسابات Twist';
      document.getElementById('title').textContent = 'استيراد حسابات Twist';
      document.getElementById('intro').textContent = 'الملف بيتشفر داخل موبايلك. لو صغير بيتبعت للبوت مباشرة، ولو كبير بيتنزل وتحتاج ترفعه في البوت. الـ JSON الأصلي مش بيتبعت ولا بيتحفظ.';
    }
    telegram.ready();
    telegram.expand();
    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (!password.value) return;
      submit.disabled = true;
      status.textContent = 'جاري تشفير الباسورد...';
      try {
        const clear = noAccountMode
          ? { challenge, mode, password: password.value }
          : { challenge, account: Number(accountId), password: password.value };
        const envelope = await encryptPayload(clear);
        password.value = '';
        telegram.sendData(JSON.stringify(envelope));
        status.textContent = 'تم الإرسال. ارجع للبوت.';
        setTimeout(() => telegram.close(), 400);
      } catch (_) {
        status.textContent = 'تعذر التشفير. اقفل الصفحة وجرب تاني.';
        submit.disabled = false;
      }
    });
    if (importMode) {
      const MAX_INPUT_BYTES = 1024 * 1024;
      const MAX_SENDDATA_BYTES = 4000;
      const MAX_PASSWORD_CHARS = 256;
      const MAX_CODE_CHARS = 4096;
      const IMPORT_SCHEMA = 'twist-registration-import-v1';
      const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      function checkAccounts(data) {
        const list = Array.isArray(data) ? data : (data && Array.isArray(data.accounts) ? data.accounts : null);
        if (!list || list.length === 0) throw new Error('الملف لازم يحتوي قائمة حسابات فيها حساب واحد على الأقل.');
        const emails = new Set();
        return list.map((entry, index) => {
          const where = 'الحساب رقم ' + (index + 1) + ': ';
          if (!entry || typeof entry !== 'object' || Array.isArray(entry)) throw new Error(where + 'لازم يكون كائن.');
          if (entry.schema !== IMPORT_SCHEMA) throw new Error(where + 'الـ schema مش مظبوط.');
          for (const field of ['email', 'password', 'deviceId', 'tgDeviceId', 'passwordlessLoginCode']) {
            if (typeof entry[field] !== 'string' || entry[field] === '') throw new Error(where + 'الحقل ' + field + ' ناقص.');
          }
          if (!EMAIL_RE.test(entry.email)) throw new Error(where + 'الإيميل مش صحيح.');
          const emailKey = entry.email.toLowerCase();
          if (emails.has(emailKey)) throw new Error(where + 'الإيميل ده مكرر في الملف.');
          emails.add(emailKey);
          if (entry.password.length > MAX_PASSWORD_CHARS) throw new Error(where + 'الباسورد أطول من 256 حرف.');
          if (!isUuidV4(entry.deviceId)) throw new Error(where + 'الحقل deviceId مش UUID v4 صحيح.');
          if (!isUuidV4(entry.tgDeviceId)) throw new Error(where + 'الحقل tgDeviceId مش UUID v4 صحيح.');
          if (entry.passwordlessLoginCode.length > MAX_CODE_CHARS) throw new Error(where + 'الكود أطول من 4096 حرف.');
          return {
            schema: IMPORT_SCHEMA,
            email: entry.email,
            password: entry.password,
            deviceId: entry.deviceId,
            tgDeviceId: entry.tgDeviceId,
            passwordlessLoginCode: entry.passwordlessLoginCode
          };
        });
      }
      async function readImportInput(file, pasted) {
        if (file && file.size > MAX_INPUT_BYTES) throw new Error('الملف أكبر من 1 ميجا.');
        const raw = file ? await file.text() : pasted;
        if (new TextEncoder().encode(raw).byteLength > MAX_INPUT_BYTES) throw new Error('الإدخال أكبر من 1 ميجا.');
        let data;
        try {
          data = JSON.parse(raw);
        } catch (_) {
          throw new Error('الـ JSON مش صالح.');
        }
        return checkAccounts(data);
      }
      function downloadEnvelope(json) {
        const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
        const link = document.createElement('a');
        link.href = url;
        link.download = 'twist-import-encrypted.json';
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      }
      importForm.addEventListener('submit', async event => {
        event.preventDefault();
        const file = importFile.files && importFile.files[0];
        const pasted = importText.value;
        importText.value = '';
        importFile.value = '';
        importSubmit.disabled = true;
        status.textContent = 'جاري التحقق...';
        let accounts;
        try {
          accounts = await readImportInput(file, pasted);
        } catch (error) {
          status.textContent = error.message;
          importSubmit.disabled = false;
          return;
        }
        status.textContent = 'جاري تشفير الملف...';
        try {
          const envelopeJson = JSON.stringify(await encryptPayload({ challenge, mode: 'import', accounts }));
          if (new TextEncoder().encode(envelopeJson).byteLength <= MAX_SENDDATA_BYTES) {
            telegram.sendData(envelopeJson);
            status.textContent = 'تم الإرسال. ارجع للبوت.';
            setTimeout(() => telegram.close(), 400);
          } else {
            downloadEnvelope(envelopeJson);
            status.textContent = 'تم تنزيل twist-import-encrypted.json. ارفعه في البوت عشان يتسجل.';
          }
        } catch (_) {
          status.textContent = 'تعذر التشفير. اقفل الصفحة وجرب تاني.';
        }
        importSubmit.disabled = false;
      });
    }
  }

  runWhenReady(() => {
    const script = document.createElement('script');
    script.src = 'https://telegram.org/js/telegram-web-app.js';
    script.onerror = () => {
      form.hidden = true;
      status.textContent = 'تعذر تحميل Telegram SDK';
    };
    script.onload = () => {
      telegram = window.Telegram && window.Telegram.WebApp;
      init();
    };
    document.head.appendChild(script);
  });
})();
</script>
</body>
</html>
